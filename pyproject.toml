[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-commercial-ems"
version = "0.1.0"
description = "Behind-the-Meter Energy Management System (EMS) for Greek Commercial SMBs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "beautifulsoup4>=4.12.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "bot*", "simulator*", "tariff_engine*", "optimization_engine*", "calibration*"]
exclude = ["tests*", "firmware*", "docs*", "scripts*"]

[tool.setuptools.package-data]
backend = ["templates/*.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends/Query in function defaults
    "BLE001",  # Do not catch blind exception
    "S110",    # try-except-pass
]

